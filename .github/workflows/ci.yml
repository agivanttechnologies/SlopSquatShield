name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22.x, 24.x]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm rebuild @biomejs/biome esbuild --foreground-scripts
      - run: npm run build
      - run: npm test

  # The launcher must work from a hook-style minimal, non-interactive environment —
  # the exit-127 failure that nvm-style installs caused. POSIX runners only; native Windows
  # (cmd/PowerShell launchers) is not covered here yet.
  launcher-e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [22.x, 24.x]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm rebuild @biomejs/biome esbuild --foreground-scripts
      - run: npm run build
      - name: Install the CLI globally (symlinked, as `npm link` does)
        run: npm link --workspace packages/cli
      - name: Launcher end-to-end (minimal-env hook, stale launcher, self-heal, CI shim)
        run: bash scripts/ci-launcher-e2e.sh

  # Build the extension, package the .vsix, and run it inside a real VS Code (the unit
  # tests with an in-memory fake editor already run in build-and-test via `npm test`). Linux only
  # for now; needs a virtual display and a few shared libraries the downloaded editor links to.
  vscode-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm rebuild @biomejs/biome esbuild --foreground-scripts
      - run: npm run build
      - name: Package the .vsix (also proves the bundle ships without a native module)
        run: npm run package -w slopsquatshield-vscode
      - uses: actions/upload-artifact@v4
        with:
          name: slopsquatshield-vscode-vsix
          path: packages/extension/slopsquatshield-vscode.vsix
      - name: Libraries and a virtual display for the downloaded VS Code
        run: sudo apt-get update && sudo apt-get install -y xvfb libasound2t64 libgbm1 libnss3 libgtk-3-0t64
      - name: Run the extension inside a real VS Code
        run: xvfb-run -a npm run test:integration -w slopsquatshield-vscode

  # The release smoke test from the PACKED package (not the workspace): install the tarball into a clean
  # prefix and check scan, the shell wrapper, the Claude Code hook and the git pre-commit hook all
  # BLOCK a hallucinated package in each ecosystem. Uses the real registries.
  packed-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm rebuild @biomejs/biome esbuild --foreground-scripts
      - run: npm run build
      - name: Pack the CLI
        run: mkdir -p "$RUNNER_TEMP/pack" && (cd packages/cli && npm pack --pack-destination "$RUNNER_TEMP/pack")
      - name: Inspect what would be published
        run: tar -tzf "$RUNNER_TEMP"/pack/*slopsquatshield-*.tgz
      - name: Smoke test the packed package
        run: bash scripts/smoke-test-packed.sh "$RUNNER_TEMP"/pack/*slopsquatshield-*.tgz

  # FR-20: the real pre-commit framework installs this repo's hook definition (language: node) and
  # only a BLOCK fails a commit.
  precommit-framework:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pre-commit
      - run: npm ci --ignore-scripts
      - run: npm rebuild @biomejs/biome esbuild --foreground-scripts
      - run: npm run build
      - name: Pack the CLI
        run: mkdir -p "$RUNNER_TEMP/pack" && (cd packages/cli && npm pack --pack-destination "$RUNNER_TEMP/pack")
      - name: Run the pre-commit framework end to end
        run: bash scripts/precommit-framework-e2e.sh "$RUNNER_TEMP"/pack/*slopsquatshield-*.tgz

