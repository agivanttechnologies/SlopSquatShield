name: Bug
description: Something doesn't work the way the README says it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. A flagged package you believe is fine? Use **False positive** instead.
        A security problem? Don't file it here; see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: The exact command
      description: The command you (or the agent) ran, and the directory it ran in.
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Full output, and the exit code
      description: Paste the whole verdict text. `echo $?` (bash/zsh) or `$LASTEXITCODE` (PowerShell) gives the exit code.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: slopsquatshield --version
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: slopsquatshield doctor
      render: text
  - type: input
    id: os
    attributes:
      label: OS and shell
      placeholder: e.g. Ubuntu 24.04 under WSL2, bash 5.2
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version and how Node is installed
      placeholder: e.g. 24.11.0 via nvm
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Agent host, if one was involved
      placeholder: e.g. Claude Code 2.x, Cursor 1.x, none
